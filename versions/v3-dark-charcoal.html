<script>
// Design tokens live in CSS variables so the whole app flips light/dark from one place.
tailwind.config={theme:{extend:{colors:{bg:'var(--bg)',surf:'var(--surf)',ink:'var(--ink)',mut:'var(--mut)',line:'var(--line)',hdr:'#121417',brand:'#00C853',onbrand:'#04210f',amber:'#FFB020',danger:'#E5484D'},fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']}}}}

<style>
:root{--bg:#F6F4EF;--surf:#fff;--ink:#121417;--mut:#6b6f75;--line:#e6e1d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#121417;--surf:#1b1f24;--ink:#f3f1ec;--mut:#98a0a8;--line:#2a3037;color-scheme:dark}.tile{background:linear-gradient(145deg,hsl(var(--h) 22% 22%),hsl(var(--h) 22% 15%))!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{cursor:pointer;touch-action:manipulation}button:active:not(:disabled){transform:scale(.97)}:focus-visible{outline:3px solid #FFB020;outline-offset:2px}
.tile{background:linear-gradient(145deg,hsl(var(--h) 65% 93%),hsl(var(--h) 55% 84%))}
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--surf) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}.up{animation:up .4s both}@keyframes pop{50%{transform:scale(1.25)}}.pop{animation:pop .3s}
.ns::-webkit-scrollbar{display:none}.ns{scrollbar-width:none}.inp{height:48px;width:100%;border-radius:14px;border:1.5px solid var(--line);background:var(--surf);padding:0 14px;font-size:14px;font-weight:500}.inp:focus{border-color:#00C853;outline:0}
dialog{border:0;padding:0;background:var(--surf);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(2px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
